name: Mirror Close Data (16:35 Beijing)

# 收盘数据镜像：工作日 16:35（收盘 15:00 后 1.5h）把当日完整收盘 K 线入库，
# 供次日 12:00 门户流水线直接使用（T-1 完整收盘口径）。
#   fetch_index(当日完整收盘，含大盘天气 5 锚定指数；CSI 收盘后才有当日 bar)
#   -> fetch_etf -> fetch_stock
#   -> housekeeping(3y/13y 滚动保留)
#   -> build_weather + build_timing_db（收盘后重建，避免 CSI 滞后导致天气载荷混日）
#   -> commit
# 节假日自动空转：无新增则跳过 commit，不产生噪音提交。

on:
  schedule:
    # 北京时间 16:35 = UTC 08:35（GitHub schedule 用 UTC）
    - cron: "35 8 * * 1-5"
  workflow_dispatch:
    inputs:
      STOCK_LIMIT:
        description: "fetch_stock --limit（探针/分片重试；留空=全市场）"
        required: false
        type: string
        default: ""
      STOCK_DAYS:
        description: "fetch_stock --days（强制回看 N 天探测通道；留空=增量）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: mirror-close
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch index daily bars (today complete close)
        # last_complete_day(): >= 15:30 北京取今日；CSIndex 收盘后发布当日值
        run: python3 scripts/fetch_index.py

      - name: Fetch ETF daily bars (Tencent channel)
        # 东财对 GitHub runner IP 连接级限流，CI 直连腾讯通道
        env:
          PREFER_TX: "1"
        run: python3 scripts/fetch_etf.py

      - name: Fetch stock daily bars (Tencent raw+hfq, today complete close)
        # 双通道防 WAF：raw 走 qt.gtimg.cn 批量快照（全市场约 90 请求）；hfq 走
        # ifzq.gtimg.cn 逐股（全局限速 ~2.5 QPS，约 35 分钟）。只写日增量小文件，
        # 每周一由 housekeeping --compact 并入年份分片（控制 git 历史膨胀）。
        # ⚠️ 腾讯 WAF 按 IP 封禁：CI runner 偶发整段被封（连续 8 次失败×3 轮自动中止）。
        # 失败不阻断镜像（index/etf/housekeeping/commit 照常），缺口由次日/portal 兜底。
        env:
          STOCK_LIMIT: ${{ inputs.STOCK_LIMIT || '' }}
          STOCK_DAYS: ${{ inputs.STOCK_DAYS || '' }}
        run: |
          EXTRA=""
          if [ -n "$STOCK_LIMIT" ]; then EXTRA="$EXTRA --limit $STOCK_LIMIT"; fi
          if [ -n "$STOCK_DAYS" ]; then EXTRA="$EXTRA --days $STOCK_DAYS"; fi
          python3 scripts/fetch_stock.py $EXTRA || echo "::warning::股票抓取被风控或失败，当日股票增量缺口由后续运行补齐"

      - name: Housekeeping (rolling retention; compact stock shards on Monday)
        # 周一把股票日增量并入年份分片并清理增量（控制 git 历史膨胀），其余天只做保留检查
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "== 周一：股票增量并入年份分片 =="
            python3 scripts/housekeeping.py --compact
          else
            python3 scripts/housekeeping.py
          fi

      - name: Build weather payload (four-layer market weather)
        # 收盘后 CSI(000300/932000) 已发布当日值；重建 weather.json，避免仅腾讯通道先行时混日。
        # 失败不阻断镜像：沿用已入库 weather.json，由次日 portal 再试。
        run: python3 scripts/build_weather.py || echo "::warning::weather 构建失败，沿用现有 weather.json"

      - name: Build timing_db (择时回测 K 线包)
        # 依赖上方 fetch_index + fetch_stock；缺标的时脚本内会单股补取。
        run: python3 scripts/build_timing_db.py || echo "::warning::timing_db 构建失败，沿用现有 timing_db.json"

      - name: Commit increments
        run: |
          git config user.name "quant-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无新增变更（节假日/无增量），跳过 commit"
          else
            git commit -m "chore(data): mirror close data $(date -u +%Y-%m-%d)"
            # 并发推送（手动 push / 另一流水线）导致非快进时先 rebase 再 push，避免数据丢在 runner 上
            git pull --rebase origin main
            git push
          fi
