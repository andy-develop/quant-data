<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="max-age=300, must-revalidate">
<title>AI策略库</title>
<link rel="prefetch" href="app.html" as="document">
<link rel="prefetch" href="echarts.min.js" as="script">
<link rel="prefetch" href="qlab/momentum.json" as="fetch">
<style>
:root{
  --ink:#16324F; --ink2:#2B4A6F; --sub:#5B7BA3; --dim:#8AA3C0;
  --line:#DDE8F4; --bg:#F6FAFE; --card:#FFFFFF; --blue:#2B6CB0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(43,108,176,.16), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(22,50,79,.10), transparent 50%),
    var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
.wrap{max-width:920px;margin:0 auto;padding:48px 20px 40px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#16324F,#2B6CB0);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;box-shadow:0 4px 14px rgba(43,108,176,.28);
}
h1{font-size:28px;font-weight:800;letter-spacing:.4px}
.sub{font-size:14px;color:var(--sub);margin:8px 0 28px;line-height:1.6}
.meta{font-size:12.5px;color:var(--dim);margin-bottom:22px}
.meta b{color:var(--ink2)}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
}
@media(max-width:640px){
  .wrap{padding:28px 14px 32px}
  h1{font-size:22px}
  .grid{grid-template-columns:1fr}
}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px 18px 18px;box-shadow:0 3px 14px rgba(43,108,176,.08);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-2px);
  border-color:rgba(43,108,176,.35);
  box-shadow:0 10px 24px rgba(43,108,176,.16);
  outline:none;
}
.card:active{transform:translateY(0)}
.kicker{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.4px;margin-bottom:6px}
.name{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:8px}
.desc{font-size:13.5px;color:var(--sub);line-height:1.65;min-height:2.6em}
.go{
  margin-top:14px;font-size:13px;font-weight:700;color:var(--blue);
  display:inline-flex;align-items:center;gap:4px;
}
.foot{margin-top:28px;font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">◇</div>
    <h1>AI策略库</h1>
  </div>
  <p class="sub">选择一个板块进入。导航页尽量轻量，策略内容在进入后按需加载。</p>
  <div class="meta">数据日期 <b id="data-date">/*__DATA_DATE__*/</b></div>
  <div class="grid" id="grid">
    <a class="card" href="app.html#/short-momentum" data-cat="short">
      <div class="kicker">01</div>
      <div class="name">短线策略</div>
      <div class="desc">动量策略、量化黑盒等短线信号与回测。</div>
      <div class="go">进入 →</div>
    </a>
    <a class="card" href="app.html#/timing-hongli" data-cat="etf">
      <div class="kicker">02</div>
      <div class="name">ETF策略</div>
      <div class="desc">红利低波、沪深300择时、行业轮动与上午快照。</div>
      <div class="go">进入 →</div>
    </a>
    <a class="card" href="app.html#/pick-home" data-cat="pick">
      <div class="kicker">03</div>
      <div class="name">个性化选股</div>
      <div class="desc">选股主页、因子库、回测验证与方案说明。</div>
      <div class="go">进入 →</div>
    </a>
    <a class="card" href="app.html#/weather-bt" data-cat="weather">
      <div class="kicker">04</div>
      <div class="name">大盘天气</div>
      <div class="desc">择时回测与天气总览，看大盘四层信号。</div>
      <div class="go">进入 →</div>
    </a>
  </div>
  <p class="foot">进入板块后会在后台预取其余资源。也可从策略页品牌名返回本导航。</p>
</div>
<script>
(function(){
  // 旧书签 / 深链：根路径带 hash 时直接进对应板块，跳过导航页
  var h = (location.hash || "").replace(/^#\/?/, "");
  if (h) {
    location.replace("app.html#/" + h.split("/").pop());
    return;
  }
  // 后台预取重页面与常用 JSON（不挡首屏）
  function warm(url){
    try { fetch(url, {credentials:"same-origin", cache:"force-cache"}).catch(function(){}); }
    catch (e) {}
  }
  var run = window.requestIdleCallback || function(fn){ setTimeout(fn, 200); };
  run(function(){
    warm("app.html");
    warm("echarts.min.js");
    warm("qlab/momentum.json");
    warm("qlab/blackbox.json");
  });
})();
</script>
</body>
</html>
